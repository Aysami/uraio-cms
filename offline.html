<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline · Uraio Business OS</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6; color: #16211f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 460px; text-align: center; background: #fff; border: 1px solid #e4ebe8; border-radius: 18px; padding: 36px 28px; box-shadow: 0 18px 40px rgba(11, 18, 32, .08); }
  .mark { width: 56px; height: 56px; border-radius: 16px; background: #0f766e; color: #fff; display: grid; place-items: center; margin: 0 auto 18px; font-size: 26px; font-weight: 800; }
  h1 { font-size: 1.4rem; margin: 0 0 10px; }
  p { color: #5b6b67; line-height: 1.6; margin: 0 0 20px; }
  button, a { display: inline-block; background: #0f766e; color: #fff; text-decoration: none; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; font-size: .92rem; }
  small { display: block; margin-top: 18px; color: #87938f; }
</style>
</head>
<body>
<main>
  <div class="mark">U</div>
  <h1>You are offline</h1>
  <p>Uraio could not reach the network. Pages you already opened may still work. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>Uraio Business OS</small>
</main>
</body>
</html>
