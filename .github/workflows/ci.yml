name: CI

on:
  push:
  pull_request:

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Uraio
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Uraio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check JavaScript
        run: find assets sw.js -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
